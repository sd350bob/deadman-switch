<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Deadman Switch</title>
</head>
<body>
  <h1>Deadman Switch</h1>

  <p>This page triggers the deadman workflow.</p>

  <script>
    async function trigger() {
      const params = new URLSearchParams(window.location.search);
      const p = params.get("p");
      const email = params.get("email");

      if (!p) {
        document.body.innerHTML += "<p>Missing parameter p.</p>";
        return;
      }

      const payload = {
        event_type: "deadman_trigger",
        client_payload: { p, email }
      };

      const res = await fetch(
        "https://api.github.com/repos/sd350bob/deadman-switch/dispatches",
        {
          method: "POST",
          headers: {
            "Accept": "application/vnd.github+json",
            "Authorization": "Bearer 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"
          },
          body: JSON.stringify(payload)
        }
      );

      if (res.ok) {
        document.body.innerHTML += "<p>Request submitted.</p>";
      } else {
        document.body.innerHTML += "<p>Error submitting request.</p>";
      }
    }

    trigger();
  </script>
</body>
</html>
