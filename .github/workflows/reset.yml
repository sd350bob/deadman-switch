name: Reset Timer

on:
  workflow_dispatch:
  #repository_dispatch:
  #  types: [reset_timer]

permissions:
  actions: write   # Grants GITHUB_TOKEN permission to trigger workflow dispatches
  contents: write  # Keeps repo write access if state files are updated
  
jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
        # Step 1: Must checkout the repository first so .git exists
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Update Repository Variable
        env:
          # secrets.PAT_DEATMAN_RESET_INTERNAL is PAT deadman_reset with perms: Read access to metadata, Read and Write access to actions variables
          GH_TOKEN: ${{ secrets.PAT_DEATMAN_RESET_INTERNAL }}
        run: |
          NEW_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          gh variable set LAST_RESET_TIMESTAMP --body "$NEW_DATE"          

      - name: Trigger Rebuild Immediately
        run: |
          gh workflow run daily-check.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # auto-generated token for this execution
