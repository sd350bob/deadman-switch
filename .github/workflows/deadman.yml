name: Deadman Switch

on:
  workflow_dispatch:
    inputs:
      p:
        description: "Parameter p (RESET_PARAM or REQUEST_SECRET_PARAM)"
        required: true
        type: string
      email:
        description: "Email address (only used when p = REQUEST_SECRET_PARAM)"
        required: false
        type: string

  schedule:
    - cron: "0 9 * * *"  # 2 AM Pacific ~ 9 AM UTC; adjust if needed

jobs:
  handle_request:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read state
        id: state
        run: |
          LAST_RESET=$(jq -r '.last_reset' state.json)
          echo "last_reset=$LAST_RESET" >> $GITHUB_OUTPUT

      - name: Compute elapsed days
        id: elapsed
        run: |
          LAST_RESET="${{ steps.state.outputs.last_reset }}"
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          SECONDS=$(( $(date -d "$NOW" +%s) - $(date -d "$LAST_RESET" +%s) ))
          DAYS=$(( SECONDS / 86400 ))
          echo "days=$DAYS" >> $GITHUB_OUTPUT

      - name: Handle RESET_PARAM
        if: inputs.p == secrets.RESET_PARAM
        run: |
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          jq --arg now "$NOW" '.last_reset = $now' state.json > state.tmp && mv state.tmp state.json
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add state.json
          git commit -m "Reset timer at $NOW" || echo "No changes to commit"
          git push
          echo "Timer reset."

      - name: Handle REQUEST_SECRET_PARAM (timer >= 7 days)
        if: inputs.p == secrets.REQUEST_SECRET_PARAM && steps.elapsed.outputs.days >= 7
        run: |
          EMAIL="${{ inputs.email }}"
          if [ -z "$EMAIL" ]; then
            echo "No email provided. Expected email input."
            exit 1
          fi

          APPROVED="${{ secrets.APPROVED_EMAILS }}"
          IFS=',' read -ra LIST <<< "$APPROVED"
          APPROVED_FLAG="false"
          for e in "${LIST[@]}"; do
            if [ "$EMAIL" = "$e" ]; then
              APPROVED_FLAG="true"
              break
            fi
          done

          if [ "$APPROVED_FLAG" != "true" ]; then
            echo "Unknown email."
            exit 1
          fi

          SECRET="${{ secrets.SECRET_PAYLOAD }}"
          OWNER="${{ secrets.OWNER_EMAIL }}"

          cat <<EOF > email.txt
To: $EMAIL
From: ${{ secrets.SMTP_FROM }}
Subject: Deadman Secret

Here is the secret:

$SECRET

EOF

          cat <<EOF > owner.txt
To: $OWNER
From: ${{ secrets.SMTP_FROM }}
Subject: Deadman Event

An approved email requested the secret.

Email: $EMAIL
Time: $(date -u +"%Y-%m-%dT%H:%M:%SZ")

EOF

          python - <<'PYCODE'
import smtplib, ssl

host = "${{ secrets.SMTP_HOST }}"
port = int("${{ secrets.SMTP_PORT }}")
user = "${{ secrets.SMTP_USER }}"
password = "${{ secrets.SMTP_PASS }}"

context = ssl.create_default_context()
with smtplib.SMTP(host, port) as server:
    server.starttls(context=context)
    server.login(user, password)
    for fname in ["email.txt", "owner.txt"]:
        with open(fname, "r") as f:
            msg = f.read()
        server.sendmail("${{ secrets.SMTP_FROM }}", [line.split(": ",1)[1].strip() for line in msg.splitlines() if line.startswith("To:")], msg)
PYCODE

          echo "An email has been sent."

          LOG_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "$LOG_TIME - $EMAIL" >> unlock.log
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add unlock.log
          git commit -m "Unlock event at $LOG_TIME for $EMAIL" || echo "No changes to commit"
          git push

      - name: Handle REQUEST_SECRET_PARAM (timer < 7 days)
        if: inputs.p == secrets.REQUEST_SECRET_PARAM && steps.elapsed.outputs.days < 7
        run: |
          REMAIN=$(( 7 - ${{ steps.elapsed.outputs.days }} ))
          echo "Time remaining: ${REMAIN} days."

      - name: Handle missing or alternate p
        if: inputs.p != secrets.RESET_PARAM && inputs.p != secrets.REQUEST_SECRET_PARAM
        run: |
          echo "Missing parameter or unknown value."

  daily_reminder:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read state
        id: state
        run: |
          LAST_RESET=$(jq -r '.last_reset' state.json)
          echo "last_reset=$LAST_RESET" >> $GITHUB_OUTPUT

      - name: Compute elapsed days
        id: elapsed
        run: |
          LAST_RESET="${{ steps.state.outputs.last_reset }}"
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          SECONDS=$(( $(date -d "$NOW" +%s) - $(date -d "$LAST_RESET" +%s) ))
          DAYS=$(( SECONDS / 86400 ))
          echo "days=$DAYS" >> $GITHUB_OUTPUT

      - name: Send reminder if between 2 and 30 days
        if: steps.elapsed.outputs.days >= 2 && steps.elapsed.outputs.days <= 30
        run: |
          OWNER="${{ secrets.OWNER_EMAIL }}"
          RESET_LINK="https://github.com/${{ github.repository }}/actions/workflows/deadman.yml?query=workflow%3ADeadman+Switch"

          cat <<EOF > reminder.txt
To: $OWNER
From: ${{ secrets.SMTP_FROM }}
Subject: Deadman Timer Reminder

Elapsed time since last reset: ${{ steps.elapsed.outputs.days }} days.

You can reset the timer by triggering the workflow with p = RESET_PARAM.

EOF

          python - <<'PYCODE'
import smtplib, ssl

host = "${{ secrets.SMTP_HOST }}"
port = int("${{ secrets.SMTP_PORT }}")
user = "${{ secrets.SMTP_USER }}"
password = "${{ secrets.SMTP_PASS }}"

context = ssl.create_default_context()
with smtplib.SMTP(host, port) as server:
    server.starttls(context=context)
    server.login(user, password)
    with open("reminder.txt", "r") as f:
        msg = f.read()
    server.sendmail("${{ secrets.SMTP_FROM }}", ["${{ secrets.OWNER_EMAIL }}"], msg)
PYCODE
