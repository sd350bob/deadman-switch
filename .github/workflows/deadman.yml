name: Deadman Switch

on:
  repository_dispatch:
    types: [deadman_trigger]

  schedule:
    - cron: "0 9 * * *"

jobs:
  handle_trigger:
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract payload
        run: |
          echo "p=${{ github.event.client_payload.p }}" >> $GITHUB_OUTPUT
          echo "email=${{ github.event.client_payload.email }}" >> $GITHUB_OUTPUT

      - name: Read state
        id: state
        run: |
          LAST_RESET=$(jq -r '.last_reset' state.json)
          echo "last_reset=$LAST_RESET" >> $GITHUB_OUTPUT

      - name: Compute elapsed days
        id: elapsed
        run: |
          LAST_RESET="${{ steps.state.outputs.last_reset }}"
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          SECONDS=$(( $(date -d "$NOW" +%s) - $(date -d "$LAST_RESET" +%s) ))
          DAYS=$(( SECONDS / 86400 ))
          echo "days=$DAYS" >> $GITHUB_OUTPUT

      - name: Reset timer
        if: steps.handle_trigger.outputs.p == secrets.RESET_PARAM
        run: |
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          jq --arg now "$NOW" '.last_reset = $now' state.json > tmp && mv tmp state.json
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add state.json
          git commit -m "Reset timer at $NOW" || true
          git push
          echo "Timer reset."

      - name: Handle secret request (>=7 days)
        if: steps.handle_trigger.outputs.p == secrets.REQUEST_SECRET_PARAM && steps.elapsed.outputs.days >= 7
        run: |
          EMAIL="${{ steps.handle_trigger.outputs.email }}"
          if [ -z "$EMAIL" ]; then
            echo "No email provided."
            exit 1
          fi

          APPROVED="${{ secrets.APPROVED_EMAILS }}"
          IFS=',' read -ra LIST <<< "$APPROVED"
          OK=false
          for e in "${LIST[@]}"; do
            if [ "$EMAIL" = "$e" ]; then OK=true; fi
          done

          if [ "$OK" = false ]; then
            echo "Unknown email."
            exit 1
          fi

          SECRET="${{ secrets.SECRET_PAYLOAD }}"
          OWNER="${{ secrets.OWNER_EMAIL }}"

          echo "Sending secret to $EMAIL"

          python - <<EOF
import smtplib, ssl

host="${{ secrets.SMTP_HOST }}"
port=int("${{ secrets.SMTP_PORT }}")
user="${{ secrets.SMTP_USER }}"
password="${{ secrets.SMTP_PASS }}"
sender="${{ secrets.SMTP_FROM }}"

msg=f"Subject: Deadman Secret\n\n{SECRET}"
owner_msg=f"Subject: Deadman Event\n\nEmail: {EMAIL}"

ctx=ssl.create_default_context()
with smtplib.SMTP(host, port) as s:
    s.starttls(context=ctx)
    s.login(user, password)
    s.sendmail(sender, EMAIL, msg)
    s.sendmail(sender, OWNER, owner_msg)
EOF

          LOG_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "$LOG_TIME - $EMAIL" >> unlock.log
          git add unlock.log
          git commit -m "Unlock event for $EMAIL" || true
          git push

      - name: Handle secret request (<7 days)
        if: steps.handle_trigger.outputs.p == secrets.REQUEST_SECRET_PARAM && steps.elapsed.outputs.days < 7
        run: |
          REMAIN=$(( 7 - ${{ steps.elapsed.outputs.days }} ))
          echo "Time remaining: $REMAIN days."

      - name: Handle unknown p
        if: steps.handle_trigger.outputs.p != secrets.RESET_PARAM && steps.handle_trigger.outputs.p != secrets.REQUEST_SECRET_PARAM
        run: |
          echo "Missing or unknown parameter."

  daily_reminder:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read state
        id: state
        run: |
          LAST_RESET=$(jq -r '.last_reset' state.json)
          echo "last_reset=$LAST_RESET" >> $GITHUB_OUTPUT

      - name: Compute elapsed days
        id: elapsed
        run: |
          LAST_RESET="${{ steps.state.outputs.last_reset }}"
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          SECONDS=$(( $(date -d "$NOW" +%s) - $(date -d "$LAST_RESET" +%s) ))
          DAYS=$(( SECONDS / 86400 ))
          echo "days=$DAYS" >> $GITHUB_OUTPUT

      - name: Send reminder
        if: steps.elapsed.outputs.days >= 2 && steps.elapsed.outputs.days <= 30
        run: |
          OWNER="${{ secrets.OWNER_EMAIL }}"
          python - <<EOF
import smtplib, ssl

host="${{ secrets.SMTP_HOST }}"
port=int("${{ secrets.SMTP_PORT }}")
user="${{ secrets.SMTP_USER }}"
password="${{ secrets.SMTP_PASS }}"
sender="${{ secrets.SMTP_FROM }}"

msg=f"Subject: Deadman Reminder\n\nElapsed: ${{ steps.elapsed.outputs.days }} days."

ctx=ssl.create_default_context()
with smtplib.SMTP(host, port) as s:
    s.starttls(context=ctx)
    s.login(user, password)
    s.sendmail(sender, OWNER, msg)
EOF
